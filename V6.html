
<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Napredni Digitron</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --calc-bg: #ffffff;
            --display-bg: #ff3b30;
            --digit-color: #ffffff;
            --depth: 10px;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            transition: background 0.3s;
        }

        .calculator {
            background: var(--calc-bg);
            width: 320px;
            padding: 25px;
            border-radius: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .display {
            background: var(--display-bg);
            color: var(--digit-color);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: right;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            min-height: 40px;
            box-shadow: inset 0 0 var(--depth) rgba(0,0,0,0.3);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: #f0f0f0;
            font-size: 18px;
            cursor: pointer;
        }

        .settings-panel {
            margin-top: 20px;
            padding: 15px;
            border-top: 1px solid #ccc;
        }

        .setting { margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons" id="buttons">
        <!-- Brojevi i operacije -->
        <button onclick="clearDisplay()">C</button>
        <button onclick="appendOperator('/')">/</button>
        <button onclick="appendOperator('*')">×</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button onclick="appendOperator('-')">-</button>
        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button onclick="appendOperator('+')">+</button>
        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button onclick="calculate()" style="grid-row: span 2">=</button>
        <button onclick="appendNumber('0')" style="grid-column: span 2">0</button>
        <button onclick="appendNumber('.')">.</button>
    </div>

    <div class="settings-panel">
        <label>Boja displeja: <input type="color" id="dispColor" onchange="updateSettings()"></label><br>
        <label>Boja cifara: <input type="color" id="digitColor" onchange="updateSettings()"></label><br>
        <label>Udubljenje: <input type="range" id="depthRange" min="0" max="30" onchange="updateSettings()"></label>
    </div>
</div>

<script>
    let currentInput = '';
    const displayElement = document.getElementById('display');

    function appendNumber(num) { currentInput += num; updateDisplay(); }
    function appendOperator(op) { currentInput += ' ' + op + ' '; updateDisplay(); }
    function clearDisplay() { currentInput = ''; updateDisplay(); }
    function updateDisplay() { displayElement.innerText = currentInput || '0'; }
    function calculate() { 
        try { currentInput = eval(currentInput).toString(); } 
        catch { currentInput = 'Greška'; }
        updateDisplay();
    }

    function updateSettings() {
        const dColor = document.getElementById('dispColor').value;
        const nColor = document.getElementById('digitColor').value;
        const depth = document.getElementById('depthRange').value + 'px';
        
        document.documentElement.style.setProperty('--display-bg', dColor);
        document.documentElement.style.setProperty('--digit-color', nColor);
        document.documentElement.style.setProperty('--depth', depth);
        
        localStorage.setItem('settings', JSON.stringify({dColor, nColor, depth}));
    }

    // Učitavanje postavki
    window.onload = () => {
        const saved = JSON.parse(localStorage.getItem('settings'));
        if (saved) {
            document.documentElement.style.setProperty('--display-bg', saved.dColor);
            document.documentElement.style.setProperty('--digit-color', saved.nColor);
            document.documentElement.style.setProperty('--depth', saved.depth);
        }
    };
</script>
</body>
</html>
